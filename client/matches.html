<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matches · Tennis Tournament</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Apply the saved light/dark choice before the page draws, so it doesn't flash -->
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="logo" href="/">🎾 Tennis <span>Tour</span></a>
      <div class="nav-links">
        <a href="/">Schedule</a>
        <a href="/players.html">Players</a>
        <a href="/coaches.html">Coaches</a>
        <a href="/matches.html" class="active">Matches</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Matches</h1>

    <div class="card">
      <h2 id="form-title" class="form-title">Create a match</h2>
      <form id="match-form">
        <label>Player 1 *
          <select name="player1Id" required></select>
        </label>
        <label>Player 2 *
          <select name="player2Id" required></select>
        </label>
        <label>Round *
          <input name="round" required list="round-options" placeholder="e.g. Quarterfinal">
          <!-- Suggestions for the round box (you can still type anything) -->
          <datalist id="round-options">
            <option value="Round 1">
            <option value="Round 2">
            <option value="Round 3">
            <option value="Quarterfinal">
            <option value="Semifinal">
            <option value="Final">
          </datalist>
        </label>
        <label>Court *
          <input name="court" required placeholder="e.g. Centre Court">
        </label>
        <label>Date & time *
          <input name="scheduledAt" type="datetime-local" required>
        </label>
        <label>Format
          <select name="bestOf">
            <option value="3">Best of 3 sets</option>
            <option value="5">Best of 5 sets</option>
          </select>
        </label>
        <label>Status
          <select name="status">
            <option value="scheduled">Upcoming</option>
            <option value="in_progress">Live</option>
            <option value="completed">Final</option>
          </select>
        </label>
        <div class="form-buttons">
          <button type="submit" id="submit-button">Create match</button>
          <button type="button" id="cancel-button" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="form-error" class="error"></p>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>When</th>
            <th>Round</th>
            <th>Court</th>
            <th>Players</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="matches-body">
          <tr><td colspan="6" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/matches.js"></script>
</body>
</html>
