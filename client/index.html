<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule · Tennis Tournament</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Apply the saved light/dark choice before the page draws, so it doesn't flash -->
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark'; } catch (e) {}
  </script>
</head>
<body>
  <header>
    <nav class="nav">
      <a class="logo" href="/">🎾 Tennis <span>Tour</span></a>
      <div class="nav-links">
        <a href="/" class="active">Schedule</a>
        <a href="/players.html">Players</a>
        <a href="/coaches.html">Coaches</a>
        <a href="/matches.html">Matches</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Schedule</h1>

    <section id="live-section" hidden>
      <h2>🔴 Live now</h2>
      <div id="live"></div>
    </section>

    <section>
      <h2>Upcoming</h2>
      <div id="upcoming"><p class="muted">Loading...</p></div>
    </section>

    <section>
      <h2>Results</h2>
      <div id="past"></div>
    </section>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/schedule.js"></script>
</body>
</html>
