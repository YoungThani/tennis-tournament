<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Players · Tennis Tournament</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav class="nav">
      <a class="logo" href="/">🎾 Tennis Tournament</a>
      <div class="nav-links">
        <a href="/">Schedule</a>
        <a href="/players.html" class="active">Players</a>
        <a href="/coaches.html">Coaches</a>
        <a href="/matches.html">Matches</a>
      </div>
    </nav>
  </header>

  <main>
    <h1>Players</h1>

    <div class="card">
      <h2 id="form-title" class="form-title">Add a player</h2>
      <form id="player-form">
        <label>Name *
          <input name="name" required placeholder="e.g. Iga Swiatek">
        </label>
        <label>Country *
          <input name="country" required placeholder="e.g. Poland">
        </label>
        <label>Ranking
          <input name="ranking" type="number" min="1">
        </label>
        <label>Age
          <input name="age" type="number" min="10" max="60">
        </label>
        <label>Plays
          <select name="plays">
            <option value="">–</option>
            <option value="right">Right-handed</option>
            <option value="left">Left-handed</option>
          </select>
        </label>
        <div class="form-buttons">
          <button type="submit" id="submit-button">Add player</button>
          <button type="button" id="cancel-button" class="secondary" hidden>Cancel</button>
        </div>
      </form>
      <p id="form-error" class="error"></p>
    </div>

    <div class="card table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Country</th>
            <th>Age</th>
            <th>Plays</th>
            <th>Coaches</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="players-body">
          <tr><td colspan="7" class="muted">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/players.js"></script>
</body>
</html>
